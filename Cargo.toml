[package]
name = "crates-query"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Ciraci <michaelciraci@hotmail.com>"]
description = """
crates-query is a simple tool to query crates.io packages from the command line
"""
documentation = "https://github.com/michaelciraci/Crates-Query"
homepage = "https://github.com/michaelciraci/Crates-Query"
repository = "https://github.com/michaelciraci/Crates-Query"
readme = "README.md"
keywords = ["cli", "crates"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.11", features = ["derive", "cargo"] }
crates-index = "3"
semver = "1.0.20"
tempfile = "3.8.1"
